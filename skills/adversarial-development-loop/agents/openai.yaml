interface:
  display_name: "对抗式自循环开发 (Adversarial Loop)"
  short_description: "实现前先证伪方案：ENUMERATE→PLAN→REFUTE→REVISE→实现(逐跳)→测试→复盘；标准化框架含 meta-bench 自评测"
  default_prompt: "用对抗式自循环开发（标准化框架）推进当前任务：⓪枚举合法状态空间(含退化输入) → ①PLAN 找理论缺口(先 grep journal) → ①½可达性自检 → ②派子 agent REFUTE 证伪尚未实现的方案 → ③REVISE → ④实现(跨层逐跳追踪) → ⑤测试(全套+字符串级证据) → ⑥复盘+落盘 loop-journal。框架约定/新种子/同步安装见 references/framework-manual.md"
